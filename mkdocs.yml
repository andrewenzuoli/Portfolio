site_name: Engineering Portfolio
site_author: Andrew (En-Zuo) Li

theme:
  name: material
  palette:
    - scheme: slate
      primary: blue
      accent: cyan

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Projects:
      - Adjustable Buck Converter: buck-converter.md