site_name: Engineering Portfolio
site_author: Andrew (En-Zuo) Li

theme:
  name: material
  palette:
    - scheme: slate
      primary: black
      accent: amber

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
