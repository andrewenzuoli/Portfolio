  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.j

nav:
  - Home: index.md
  - Projects:
      - Adjustable Buck Converter: buck-converter.md

extra_css:
  - stylesheets/extra.css